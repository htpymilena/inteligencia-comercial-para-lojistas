[project]
name = "nexo-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12", "pydantic==2.11.5", "pydantic-settings==2.9.1",
  "uvicorn==0.34.2", "SQLAlchemy==2.0.41", "alembic==1.16.1",
  "psycopg[binary]==3.2.9",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.13", "mypy==1.15.0",
  "PyYAML==6.0.2", "types-PyYAML==6.0.12.20250516", "jsonschema==4.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["app"]
cache_dir = "../.venv/.mypy_cache"
