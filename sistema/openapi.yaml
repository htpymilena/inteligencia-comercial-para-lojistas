# CONTRATO DE PLANEJAMENTO — rotas MXX passam a existir apenas após implementação do módulo.
# A API real deve respeitar este arquivo e não anunciar endpoints ficticiamente como concluídos.
openapi: 3.1.0
info:
  title: NEXO 2031 — API do MVP Web
  version: 1.0.0
  description: Contrato HTTP planejado para desenvolvimento incremental. Dados de monitoramento, heatmap, IA
    e circuitos são DEMO; o documento não implica endpoints já implementados.
servers:
- url: http://localhost:8000
  description: API FastAPI no host (desenvolvimento)
- url: /
  description: Mesmo domínio via proxy Vite (frontend usa base /api/v1)
tags:
- name: Health
  description: Serviço
- name: Auth
  description: Identidade
- name: Stores
  description: Lojas
- name: Dashboard
  description: Métricas agregadas
- name: Monitoring
  description: Monitoramento fictício
- name: Heatmap
  description: Zonas e mapa sintético
- name: Recommendations
  description: Recomendações explicáveis
- name: Experiments
  description: Ações comerciais
- name: Reports
  description: Comparação descritiva
- name: Circuits
  description: Campanhas de três lojas
security:
- BearerAuth: []
paths:
  /health:
    get:
      tags:
      - Health
      operationId: verificarSaude
      summary: Estado do serviço
      x-mvp-module: M00
      responses:
        '200':
          description: Operação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                service: nexo-api
        '500':
          $ref: '#/components/responses/Error500'
      security: []
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: Autenticar usuário de demonstração
      x-mvp-module: M01
      responses:
        '200':
          description: Operação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      description: Credenciais são obtidas do ambiente de demonstração; não persistir token no localStorage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: lojista@demo.invalid
              password: <senha-configurada-no-env>
      security: []
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      operationId: obterPerfil
      summary: Dados do usuário autenticado
      x-mvp-module: M01
      responses:
        '200':
          description: Operação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Error401'
        '500':
          $ref: '#/components/responses/Error500'
  /api/v1/stores:
    get:
      tags:
      - Stores
      operationId: listarLojas
      summary: Listar lojas autorizadas
      x-mvp-module: M01
      responses:
        '200':
          description: Operação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoresResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '500':
          $ref: '#/components/responses/Error500'
  /api/v1/stores/{store_id}:
    get:
      tags:
      - Stores
      operationId: obterLoja
      summary: Detalhar loja autorizada
      x-mvp-module: M01
      responses:
        '200':
          description: Operação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
      - &id001
        name: store_id
        in: path
        required: true
        description: ID da loja, com autorização verificada no servidor
        schema: &id005
          type: string
          format: uuid
  /api/v1/stores/{store_id}/dashboard:
    get:
      tags:
      - Dashboard
      operationId: obterDashboard
      summary: KPIs agregados do período
      x-mvp-module: M02
      responses:
        '200':
          description: Operação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
              example:
                store_id: 00000000-0000-4000-8000-000000000001
                period_start: '2026-11-01'
                period_end: '2026-11-07'
                data_origin: DEMO
                visitors: 1248
                interactions: 312
                sales_count: 198
                revenue_brl: '18900.00'
                conversion_rate: 15.87
                visitor_change_percent: 8.0
                sales_change_percent: 10.0
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      description: Percentuais nulos quando não houver denominador; período inclusivo, origem DEMO.
      parameters:
      - *id001
      - &id003
        name: period_start
        in: query
        required: true
        description: Início inclusivo (YYYY-MM-DD), máximo de 366 dias
        schema: &id002
          type: string
          format: date
      - &id004
        name: period_end
        in: query
        required: true
        description: Fim inclusivo (YYYY-MM-DD)
        schema: *id002
  /api/v1/stores/{store_id}/metrics/daily:
    get:
      tags:
      - Dashboard
      operationId: listarMetricasDiarias
      summary: Série diária agregada
      x-mvp-module: M02
      responses:
        '200':
          description: Operação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyMetricsResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
      - *id001
      - *id003
      - *id004
  /api/v1/stores/{store_id}/cameras:
    get:
      tags:
      - Monitoring
      operationId: listarCamerasDemo
      summary: Câmeras fictícias da loja
      x-mvp-module: M03
      responses:
        '200':
          description: Operação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraListResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      description: Metadados de câmeras simuladas, não há URL de vídeo real.
      parameters:
      - *id001
  /api/v1/stores/{store_id}/monitoring/demo:
    get:
      tags:
      - Monitoring
      operationId: obterMonitoramentoDemo
      summary: Contagens agregadas simuladas
      x-mvp-module: M03
      responses:
        '200':
          description: Operação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitoringDemoResponse'
              example:
                store_id: 00000000-0000-4000-8000-000000000001
                is_simulated: true
                data_origin: DEMO
                snapshot_at: '2026-11-07T18:00:00Z'
                people_now: 18
                entries_today: 126
                exits_today: 103
                zones: []
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
      - *id001
  /api/v1/stores/{store_id}/zones:
    get:
      tags:
      - Heatmap
      operationId: listarZonas
      summary: Zonas do mapa esquemático
      x-mvp-module: M03
      responses:
        '200':
          description: Operação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneListResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
      - *id001
