  /api/v1/stores/{store_id}/recommendations:
    get:
      tags:
      - Recommendations
      operationId: listarRecomendacoes
      summary: Listar recomendações explicáveis
      x-mvp-module: M04
      responses:
        '200':
          description: Operação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationListResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
      - *id001
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/RecommendationStatus'
  /api/v1/stores/{store_id}/recommendations/{recommendation_id}:
    patch:
      tags:
      - Recommendations
      operationId: atualizarRecomendacao
      summary: Aceitar ou descartar recomendação
      x-mvp-module: M04
      responses:
        '200':
          description: Operação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recommendation'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      description: Apenas transição de PROPOSED para ACCEPTED ou DISMISSED. Repetição de transição terminal
        gera 409.
      parameters:
      - *id001
      - name: recommendation_id
        in: path
        required: true
        schema: *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationUpdateRequest'
            example:
              status: ACCEPTED
  /api/v1/stores/{store_id}/experiments:
    get:
      tags:
      - Experiments
      operationId: listarExperimentos
      summary: Listar experimentos da loja
      x-mvp-module: M05
      responses:
        '200':
          description: Operação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentListResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
