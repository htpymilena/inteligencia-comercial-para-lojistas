      tags:
      - Experiments
      operationId: criarExperimento
      summary: Criar experimento vinculado à recomendação aceita
      x-mvp-module: M05
      responses:
        '201':
          description: Operação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
      - *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentCreateRequest'
            example:
              recommendation_id: 00000000-0000-4000-8000-000000000011
              title: Testar acessórios no corredor central
              metric: SALES
              start_date: '2026-11-01'
              end_date: '2026-11-07'
  /api/v1/stores/{store_id}/experiments/{experiment_id}:
    get:
      tags:
      - Experiments
      operationId: obterExperimento
      summary: Detalhar experimento
      x-mvp-module: M05
      responses:
        '200':
          description: Operação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
      - *id001
      - &id006
        name: experiment_id
        in: path
        required: true
        schema: *id005
  /api/v1/stores/{store_id}/experiments/{experiment_id}/status:
    patch:
      tags:
      - Experiments
      operationId: alterarStatusExperimento
      summary: Iniciar, concluir ou cancelar experimento
      x-mvp-module: M05
      responses:
        '200':
          description: Operação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Experiment'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      parameters:
      - *id001
      - *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentStatusUpdateRequest'
  /api/v1/stores/{store_id}/experiments/{experiment_id}/result:
    get:
      tags:
      - Experiments
      operationId: obterResultadoExperimento
      summary: Comparar antes e durante um experimento
      x-mvp-module: M05
      responses:
        '200':
          description: Operação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentResultResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      description: Se não estiver COMPLETED ou faltar dados de uma das janelas, available=false e números nulos.
      parameters:
      - *id001
      - *id006
  /api/v1/stores/{store_id}/reports/summary:
    get:
      tags:
      - Reports
      operationId: obterRelatorioComparativo
      summary: Comparar período atual com período anterior equivalente
      x-mvp-module: M06
      responses:
        '200':
          description: Operação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparativeReportResponse'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
      description: Compara quantidades iguais de dias; se não houver dados completos, available=false.
      parameters:
      - *id001
      - *id003
      - *id004
  /api/v1/circuits:
    get:
      tags:
      - Circuits
      operationId: listarCircuitos
