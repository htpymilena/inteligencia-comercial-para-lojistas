components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT obtido em POST /api/v1/auth/login
  schemas:
    ApiErrorDetail:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          example: FORBIDDEN
        message:
          type: string
          example: Acesso não autorizado à loja
        details:
          anyOf:
          - type: object
            additionalProperties: true
          - type: 'null'
      required:
      - code
      - message
      - details
    ApiError:
      type: object
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ApiErrorDetail'
        request_id:
          type: string
          example: req_123abc
      required:
      - error
      - request_id
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - ok
        service:
          type: string
          example: nexo-api
      required:
      - status
      - service
    Role:
      type: string
      enum:
      - ADMIN
      - LOJISTA
    DataOrigin:
      type: string
      enum:
      - DEMO
    User:
      type: object
      additionalProperties: false
      properties:
        id: *id005
        email:
          type: string
          format: email
        display_name:
          type: string
          minLength: 1
        role:
          $ref: '#/components/schemas/Role'
      required:
      - id
      - email
      - display_name
      - role
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    LoginResponse:
      type: object
      additionalProperties: false
      properties:
        access_token:
          type: string
          minLength: 10
        token_type:
          type: string
          enum:
          - bearer
        user:
          $ref: '#/components/schemas/User'
      required:
      - access_token
      - token_type
      - user
    Store:
      type: object
      additionalProperties: false
      properties:
        id: *id005
        name:
          type: string
          minLength: 1
        segment:
          type: string
          minLength: 1
        description:
          anyOf:
          - type: string
          - type: 'null'
        is_demo:
          type: boolean
      required:
      - id
      - name
      - segment
      - description
      - is_demo
    StoresResponse:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Store'
      required:
      - items
    DashboardSummary:
      type: object
      additionalProperties: false
      properties:
        store_id: *id005
        period_start: *id002
        period_end: *id002
        data_origin:
          $ref: '#/components/schemas/DataOrigin'
        visitors:
          type: integer
          minimum: 0
        interactions:
          type: integer
          minimum: 0
        sales_count:
          type: integer
          minimum: 0
        revenue_brl: &id008
          type: string
          pattern: ^\d+\.\d{2}$
